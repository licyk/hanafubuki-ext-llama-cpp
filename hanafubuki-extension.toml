schema = 1
id = "io.github.licyk.llama-cpp"
name = "llama.cpp"
version = "0.2.0"
publisher = "licyk"
license = "GPL-3.0-only"
description = { en = "Install, run and update llama.cpp's llama-server, with its chat page in Hanafubuki.", zh = "安装、运行和更新 llama.cpp 的 llama-server，并在 Hanafubuki 中打开其聊天页面。" }

[engines]
# Backend-provided types with `{host.python}`, `{extension.root}`,
# `[environment]`, `terminal`, previews and discovery signatures, and
# `sdWebuiAllInOne`; 0.3.30: the component map an operation is given;
# 0.3.31: the component map of each instance `instances.ofType` lists;
# 0.3.32: `[update]`; 0.3.35: the standard `update-check` operation
# (`provider.checkUpdate`), the application's update check.
hanafubuki = ">=0.3.35, <0.4"
api = 1

# Each release publishes `latest.json` beside its package (scripts/package.py).
# The package carries no native program: the install script downloads
# llama.cpp's builds at install time, so one entry serves every system.
[update]
url = "https://github.com/licyk/hanafubuki-ext-llama-cpp/releases/latest/download/latest.json"

[backend]
python = "backend/main.py"
# sd_webui_all_in_one on the backend's import path, as every extension of the
# validation plan declares. The backend imports nothing from it today: the
# library is used by scripts/install.py, a `{host.python}` step.
sdWebuiAllInOne = true

[permissions]
instances = "own-types"        # instances.ofType: the status panel reads its instances' files
network = ["api.github.com"]   # download.fetch: the release listing, through the application's proxy

[contributes]
instanceTypes = "types/*.toml"
settings = "schemas/settings.json"
locales = "locales/{locale}.json"
ui = [
  { slot = "management.sections", kind = "schema", source = "ui/status.json" },
]
